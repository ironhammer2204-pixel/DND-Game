services:
  - type: web
    name: dnd-game-server
    env: node
    region: singapore
    plan: free
    buildCommand: npm install --prefix=../.. && npx turbo run build --filter=server
    startCommand: node --dns-result-order=ipv4first apps/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://ironhammer.vercel.app
